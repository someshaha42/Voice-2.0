name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | sed -E 's/.*version "([0-9]+).*/\1/')
          echo "Detected Java major version: ${JAVA_VER}"
          if ! [[ "${JAVA_VER}" =~ ^[0-9]+$ ]] || [ "${JAVA_VER}" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected '${JAVA_VER}'."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Temporary debug keystore ./debug.keystore was not created."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${APK_PATH}" ] || [ ! -s "${APK_PATH}" ] || [[ "${APK_PATH}" != *.apk ]]; then
            echo "::error::Expected debug APK not found or invalid at ${APK_PATH}"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk" -print
            fi
            exit 1
          fi
          ls -lh "${APK_PATH}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${APK_PATH}" ] || [ ! -s "${APK_PATH}" ]; then
            echo "::error::Verified APK missing at ${APK_PATH}"
            exit 1
          fi
          RELEASE_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "${RELEASE_DIR}"
          RAW_REPO="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO=$(printf '%s' "${RAW_REPO}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          if [ -z "${SAFE_REPO}" ]; then
            SAFE_REPO="android-app"
          fi
          ASSET_NAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_NAME}"
          cp "${APK_PATH}" "${ASSET_PATH}"
          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Prepared release asset invalid at ${ASSET_PATH}"
            exit 1
          fi
          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Release asset validation failed."
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          Automatically generated debug APK built by GitHub Actions.

          - Workflow Run: #${GITHUB_RUN_NUMBER} (Attempt ${GITHUB_RUN_ATTEMPT})
          - Source Commit SHA: \`${GITHUB_SHA}\`
          - Intended for testing only (not a Google Play production release).
          - Signed only with a temporary debug keystore.
          EOF
          )
          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --target "${GITHUB_SHA}" \
            --latest \
            --notes "${RELEASE_NOTES}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="${{ steps.publish_release.outputs.release_tag }}"
            RELEASE_TITLE="${{ steps.publish_release.outputs.release_title }}"
            ASSET_NAME="${{ steps.publish_release.outputs.asset_name }}"
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url --jq .url)
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            {
              echo "### Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **APK Asset:** \`${ASSET_NAME}\` (downloadable directly under the release **Assets** section)"
              echo "- **GitHub Release URL:** ${RELEASE_URL}"
              echo "- **Backup Artifact:** Normal Actions artifact \`app-debug-apk\` is also available on this workflow run."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build and Actions artifact upload (app-debug-apk) succeeded."
            {
              echo "### Debug APK Built (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed, however the debug APK build completed cleanly."
              echo ""
              echo "- **Backup Download:** Download the \`app-debug-apk\` artifact directly from the **Artifacts** section of this workflow run."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
